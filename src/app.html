<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />

		<script>
			// Set theme before first paint (saved choice, else device) to avoid a flash
			(function () {
				try {
					var t = localStorage.getItem('theme');
					document.documentElement.dataset.theme =
						t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				} catch (e) {}
			})();
		</script>

		<link rel="preconnect" href="https://www.googletagmanager.com" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
		<link
			href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

		%sveltekit.head%

		<!-- Google Tag Manager -->
		<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
		new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
		j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
		'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
		})(window,document,'script','dataLayer','GTM-KQ5BNBQ');</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KQ5BNBQ"
		height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
